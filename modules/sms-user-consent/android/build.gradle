plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.akna.smsconsent'
version = '1.0.0'

android {
  namespace "com.akna.smsconsent"
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
  }
}

dependencies {
  // SMS User Consent API: READ_SMS izni gerekmez, Play Store politikasına uygundur.
  implementation 'com.google.android.gms:play-services-auth-api-phone:18.1.0'
}
